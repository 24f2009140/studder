<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studder - Profiles</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="ui-body">
    <div class="ui-container">
      <header class="ui-header">
        <h1 class="ui-h1">Studder</h1>
        <p class="ui-muted">No more stuttering through forms.</p>
        <p class="ui-muted">
          Profiles are stored locally in this browser and never leave your device.
        </p>
      </header>

      <section class="ui-section">
        <h2 class="ui-h2">Saved profiles</h2>
        <div id="profile-list"></div>
        <div class="ui-inline-group" style="margin-top: 12px; gap: 10px;">
          <button type="button" class="ui-btn ui-btn-small" id="export-profiles-btn" style="margin: 0; width: auto;">Export Profiles</button>
          <button type="button" class="ui-btn ui-btn-small" id="import-profiles-btn" style="margin: 0; width: auto;">Import Profiles</button>
          <input type="file" id="import-profiles-input" accept=".json" style="display: none;" />
        </div>
      </section>

      <section class="ui-section">
        <h2 class="ui-h2" id="form-title">Add profile</h2>
        <form id="profile-form">
          <input type="hidden" id="profile-id" value="" />

          <div class="ui-form-row">
            <label class="ui-label" for="nickname">Profile nickname</label>
            <input class="ui-input" type="text" id="nickname" name="nickname" placeholder="e.g. Personal, Work, etc." />
          </div>

          <div class="ui-grid-3">
            <div class="ui-form-row">
              <label class="ui-label" for="firstName">First name <span class="ui-required">*</span></label>
              <input class="ui-input" type="text" id="firstName" name="firstName" required />
            </div>
            <div class="ui-form-row">
              <label class="ui-label" for="middleName">Middle name</label>
              <input class="ui-input" type="text" id="middleName" name="middleName" />
            </div>
            <div class="ui-form-row">
              <label class="ui-label" for="lastName">Last name <span class="ui-required">*</span></label>
              <input class="ui-input" type="text" id="lastName" name="lastName" required />
            </div>
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="fullName">Full name</label>
            <input class="ui-input" type="text" id="fullName" name="fullName" />
            <p class="ui-hint">Choose preferred full-name order:</p>
            <div class="ui-choice-group">
              <label class="ui-choice-item" for="fullNameOrderFirstLast">
                <input type="radio" id="fullNameOrderFirstLast" name="fullNameOrder" value="first_last" checked />
                First name + Last name
              </label>
              <label class="ui-choice-item" for="fullNameOrderLastFirst">
                <input type="radio" id="fullNameOrderLastFirst" name="fullNameOrder" value="last_first" />
                Last name + First name
              </label>
            </div>
            <p class="ui-hint">Used if a form asks for one combined name field.</p>
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="gender">Gender</label>
            <select class="ui-input" id="gender" name="gender">
              <option value="">Prefer not to say</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="ui-grid-2">
            <div class="ui-form-row">
              <label class="ui-label" for="email">Email <span class="ui-required">*</span></label>
              <input class="ui-input" type="email" id="email" name="email" required />
            </div>
            <div class="ui-form-row">
              <label class="ui-label" for="alternateEmail">Alternate email</label>
              <input class="ui-input" type="email" id="alternateEmail" name="alternateEmail" />
            </div>
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="phone">Phone number</label>
            <div class="ui-inline-group">
              <select class="ui-input" id="phoneCountry" name="phoneCountry"></select>
              <input class="ui-input" type="tel" id="phone" name="phone" placeholder="Phone number" />
            </div>
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="alternatePhone">Alternate phone number</label>
            <input class="ui-input" type="tel" id="alternatePhone" name="alternatePhone" />
          </div>

          <div class="ui-form-row">
            <label class="ui-label">Date of birth</label>
            <div class="ui-inline-group">
              <input class="ui-input" type="text" id="dobDay" placeholder="DD" maxlength="2" inputmode="numeric" />
              <input class="ui-input" type="text" id="dobMonth" placeholder="MM" maxlength="2" inputmode="numeric" />
              <input class="ui-input" type="text" id="dobYear" placeholder="YYYY" maxlength="4" inputmode="numeric" />
            </div>
            <p class="ui-hint">Always day, then month, then year.</p>
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="doorNumber">Address Line 1</label>
            <input class="ui-input" type="text" id="doorNumber" name="doorNumber" placeholder="e.g. Flat 4B, Sunrise Apartments" />
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="area">Address Line 2</label>
            <input class="ui-input" type="text" id="area" name="area" />
          </div>

          <div class="ui-form-row">
            <label class="ui-label" for="landmark">Landmark</label>
            <input class="ui-input" type="text" id="landmark" name="landmark" />
          </div>

          <div class="ui-grid-2">
            <div class="ui-form-row">
              <label class="ui-label" for="city">City</label>
              <input class="ui-input" type="text" id="city" name="city" />
            </div>
            <div class="ui-form-row">
              <label class="ui-label" for="state">State</label>
              <input class="ui-input" type="text" id="state" name="state" />
            </div>
          </div>

          <div class="ui-grid-2">
            <div class="ui-form-row">
              <label class="ui-label" for="country">Country</label>
              <input class="ui-input" type="text" id="country" name="country" />
            </div>
            <div class="ui-form-row">
              <label class="ui-label" for="zip">ZIP / PIN code</label>
              <input class="ui-input" type="text" id="zip" name="zip" />
            </div>
          </div>

          <button type="submit" class="ui-btn ui-btn-primary" id="save-btn">Save profile</button>
          <button type="button" class="ui-btn" id="cancel-edit-btn" style="display:none;">Cancel edit</button>
        </form>
      </section>
    </div>
  </body>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</html>
