<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studder</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="ui-body popup-body">
    <header class="ui-header">
      <h1 class="ui-h1">Studder</h1>
      <p class="ui-muted">No more stuttering through forms.</p>
    </header>

    <main>
      <p id="profile-count" class="ui-muted">Loading profiles...</p>
      
      <div id="fill-stats-container" style="text-align: center; margin: 12px 0;">
        <div class="studder-circular-progress" id="progress-circle" style="--percent: 0">
          <svg class="studder-progress-svg" viewBox="0 0 100 100">
            <circle class="studder-progress-bg" cx="50" cy="50" r="40"></circle>
            <circle class="studder-progress-bar" cx="50" cy="50" r="40"></circle>
          </svg>
          <span class="studder-progress-text" id="progress-text">0%</span>
        </div>
        <p id="fill-stats-label" class="ui-muted" style="margin: 4px 0 0 0; font-size: 11px;">0/0 fields filled</p>
      </div>

      <button id="fill-btn" type="button" class="ui-btn ui-btn-primary">
        Fill current page (Ctrl+Shift+F)
      </button>

      <button id="reset-btn" type="button" class="ui-btn ui-btn-danger">
        Reset Form
      </button>

      <ul id="profile-list" class="ui-list"></ul>

      <button id="manage-btn" type="button" class="ui-btn">
        Add / edit profiles
      </button>
    </main>
  </body>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</html>
